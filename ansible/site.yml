---
# Bootstrap every EC2 node identically: Docker + Kubernetes (k3s).
# Monitoring (Prometheus/Grafana) is deployed into the cluster by deploy.yml.
- name: Base configuration on all nodes
  hosts: k8s
  become: true
  roles:
    - common
    - docker

- name: Kubernetes control plane
  hosts: k8s_server
  become: true
  roles:
    - k3s_server

- name: Kubernetes workers
  hosts: k8s_agents
  become: true
  roles:
    - k3s_agent

# Only present in the inventory when enable_sonarqube = true.
- name: SonarQube server
  hosts: sonarqube
  become: true
  roles:
    - sonarqube
