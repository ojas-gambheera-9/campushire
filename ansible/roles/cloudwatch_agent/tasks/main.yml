---
- name: Download CloudWatch agent package
  ansible.builtin.get_url:
    url: "{{ cloudwatch_agent_url }}"
    dest: /tmp/amazon-cloudwatch-agent.deb
    mode: "0644"

- name: Install CloudWatch agent
  ansible.builtin.apt:
    deb: /tmp/amazon-cloudwatch-agent.deb

- name: Ensure config directory exists
  ansible.builtin.file:
    path: /etc/campushire
    state: directory
    mode: "0755"

- name: Write agent configuration (kept outside the agent's own folder)
  ansible.builtin.template:
    src: config.json.j2
    dest: /etc/campushire/cloudwatch-agent.json
    mode: "0644"
  register: cwa_config

- name: Load configuration into the agent (only when it changed)
  ansible.builtin.command: >
    /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
    -a fetch-config -m ec2 -c file:/etc/campushire/cloudwatch-agent.json -s
  when: cwa_config.changed

- name: Make sure the agent is running and starts on boot
  ansible.builtin.service:
    name: amazon-cloudwatch-agent
    state: started
    enabled: true
