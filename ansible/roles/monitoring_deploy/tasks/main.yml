---
# Prometheus + Alertmanager + Grafana + node-exporter, all in the "monitoring" namespace.
# Static config files (prometheus.yml, alert rules, dashboard JSON) are loaded with
# `kubectl create configmap --from-file` so their {{ }} templating is never touched by Jinja.
- name: Ensure monitoring manifest directory
  ansible.builtin.file:
    path: /opt/campushire/monitoring
    state: directory
    mode: "0755"

- name: Copy static monitoring files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../k8s/monitoring/{{ item }}"
    dest: "/opt/campushire/monitoring/{{ item | basename }}"
    mode: "0644"
  loop:
    - namespace.yaml
    - prometheus.yaml
    - node-exporter.yaml
    - alertmanager.yaml
    - grafana-config.yaml
    - prometheus.yml
    - alert-rules.yml
    - dashboards/campushire.json

- name: Render templated monitoring files
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../k8s/monitoring/{{ item.src }}"
    dest: "/opt/campushire/monitoring/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: alertmanager.yml.j2, dest: alertmanager.yml }
    - { src: grafana.yaml.j2, dest: grafana.yaml }

- name: Create namespace
  ansible.builtin.command: k3s kubectl apply -f /opt/campushire/monitoring/namespace.yaml
  changed_when: true

- name: Config maps from files (prometheus, alert rules, alertmanager, dashboard)
  ansible.builtin.shell: |
    set -e
    k=/opt/campushire/monitoring
    k3s kubectl -n monitoring create configmap prometheus-config \
      --from-file=prometheus.yml=$k/prometheus.yml \
      --from-file=alert-rules.yml=$k/alert-rules.yml \
      --dry-run=client -o yaml | k3s kubectl apply -f -
    k3s kubectl -n monitoring create configmap alertmanager-config \
      --from-file=alertmanager.yml=$k/alertmanager.yml \
      --dry-run=client -o yaml | k3s kubectl apply -f -
    k3s kubectl -n monitoring create configmap grafana-dashboards \
      --from-file=campushire.json=$k/campushire.json \
      --dry-run=client -o yaml | k3s kubectl apply -f -
  args:
    executable: /bin/bash
  changed_when: true

- name: Grafana admin password secret
  ansible.builtin.shell: |
    k3s kubectl -n monitoring create secret generic grafana-admin \
      --from-literal=password="$GRAFANA_PASSWORD" --dry-run=client -o yaml | k3s kubectl apply -f -
  environment:
    GRAFANA_PASSWORD: "{{ grafana_admin_password }}"
  no_log: true
  changed_when: true

- name: Apply workloads
  ansible.builtin.shell: |
    k=/opt/campushire/monitoring
    k3s kubectl apply -f $k/grafana-config.yaml -f $k/prometheus.yaml -f $k/node-exporter.yaml \
      -f $k/alertmanager.yaml -f $k/grafana.yaml
  changed_when: true

# Config maps changed in place do not restart pods, so roll them to pick up new config.
- name: Restart Prometheus, Alertmanager and Grafana to load the new config
  ansible.builtin.command: k3s kubectl -n monitoring rollout restart deployment/{{ item }}
  loop: [prometheus, alertmanager, grafana]
  changed_when: true

- name: Wait for the monitoring stack
  ansible.builtin.command: k3s kubectl -n monitoring rollout status deployment/{{ item }} --timeout=240s
  loop: [prometheus, alertmanager, grafana]
  changed_when: false

- name: Grafana health through the NodePort
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_node_port }}/grafana/api/health"
    status_code: 200
  register: gf
  retries: 12
  delay: 5
  until: gf.status == 200
