---
- name: Install k3s agent and join the cluster
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION='{{ k3s_version }}' \
      K3S_URL='https://{{ hostvars[groups["k8s_server"][0]].private_ip }}:6443' \
      K3S_TOKEN='{{ hostvars[groups["k8s_server"][0]].k3s_join_token }}' \
      sh -
  args:
    creates: /usr/local/bin/k3s-agent-uninstall.sh
  no_log: true

- name: Ensure k3s-agent is running
  ansible.builtin.service:
    name: k3s-agent
    state: started
    enabled: true
