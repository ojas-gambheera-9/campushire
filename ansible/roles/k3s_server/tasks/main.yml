---
# k3s = certified lightweight Kubernetes. Traefik/servicelb are disabled: the AWS ALB is our ingress.
- name: Install k3s server
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION='{{ k3s_version }}' \
      INSTALL_K3S_EXEC='server --write-kubeconfig-mode 644 --disable traefik --disable servicelb --tls-san {{ ansible_host }}' \
      sh -
  args:
    creates: /usr/local/bin/k3s

- name: Wait for the node to be Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false
  retries: 3
  delay: 10
  register: ready
  until: ready.rc == 0

- name: Read join token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: token_raw
  no_log: true

- name: Publish join token for workers
  ansible.builtin.set_fact:
    k3s_join_token: "{{ token_raw.content | b64decode | trim }}"
  no_log: true
