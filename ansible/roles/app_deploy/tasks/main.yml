---
- name: ECR login helper (ECR tokens expire every 12h, so refresh the pull secret on a timer)
  ansible.builtin.template:
    src: ecr-login.sh.j2
    dest: /usr/local/bin/ecr-login.sh
    mode: "0750"

- name: Systemd service for ECR login
  ansible.builtin.copy:
    dest: /etc/systemd/system/ecr-login.service
    content: |
      [Unit]
      Description=Refresh ECR pull secret in Kubernetes
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/ecr-login.sh
  notify: Reload systemd

- name: Systemd timer for ECR login (every 6h)
  ansible.builtin.copy:
    dest: /etc/systemd/system/ecr-login.timer
    content: |
      [Unit]
      Description=Refresh ECR pull secret every 6 hours
      [Timer]
      OnBootSec=2min
      OnUnitActiveSec=6h
      [Install]
      WantedBy=timers.target
  notify: Reload systemd

- name: Flush handlers so systemd sees the units
  ansible.builtin.meta: flush_handlers

- name: Create namespace
  ansible.builtin.command: k3s kubectl create namespace {{ app_namespace }}
  register: ns
  failed_when: ns.rc != 0 and 'AlreadyExists' not in ns.stderr
  changed_when: ns.rc == 0

- name: Enable ECR timer
  ansible.builtin.systemd:
    name: ecr-login.timer
    state: started
    enabled: true

- name: Ensure manifest directory
  ansible.builtin.file:
    path: /opt/campushire/k8s
    state: directory
    mode: "0755"

- name: Create/refresh ECR pull secret now
  ansible.builtin.command: /usr/local/bin/ecr-login.sh
  changed_when: true

- name: Create/refresh application secret (MongoDB URI)
  ansible.builtin.shell: |
    k3s kubectl -n {{ app_namespace }} create secret generic campushire-secrets \
      --from-literal=MONGODB_URI="$MONGODB_URI" --dry-run=client -o yaml | k3s kubectl apply -f -
  environment:
    MONGODB_URI: "{{ mongodb_uri }}"
  no_log: true
  changed_when: true

- name: Render Kubernetes manifests
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../k8s/{{ item }}.j2"
    dest: "/opt/campushire/k8s/{{ item }}"
    mode: "0644"
  loop: [configmap.yaml, deployment.yaml, service.yaml, hpa.yaml, pdb.yaml]
  register: manifests

- name: Apply manifests
  ansible.builtin.command: k3s kubectl apply -f /opt/campushire/k8s/
  changed_when: true

- name: Wait for rolling update to complete
  ansible.builtin.command: k3s kubectl -n {{ app_namespace }} rollout status deployment/campushire-api --timeout=240s
  changed_when: false

- name: Smoke test through the NodePort
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ node_port }}/health"
    status_code: 200
  register: smoke
  retries: 6
  delay: 5
  until: smoke.status == 200
